name: aparent1
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.6.13
  - tensorflow=1.13.1
  - keras=2.2.4
  - numpy=1.16.2
  - scipy=1.2.1
  - pandas=0.24.2
  - matplotlib=3.1.1
  - h5py=2.10.0
  - pip
  - pip:
      - isolearn==0.2
      - requests

# The `aparent` package itself is NOT on conda/pip. Clone it separately and set
# "aparent_dir" in the config (see README, section 1). Its saved_models/ folder holds the weights.
